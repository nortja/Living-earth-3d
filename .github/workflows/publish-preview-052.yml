name: Publish 0.5.2 preview once
on:
  push:
    branches: [release/preview-0.5.2]
permissions:
  contents: write
concurrency:
  group: publish-preview-052
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y nsis
          python3 -m pip install --break-system-packages -r packaging/windows/requirements-build.txt
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          mkdir -p /tmp/earth-tools
          cd /tmp/earth-tools
          curl -fLsS "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          for name in Godot_v4.6.3-stable_linux.x86_64.zip Godot_v4.6.3-stable_export_templates.tpz; do
            curl -fLsS "$base/$name" -o "$name"
            awk -v n="$name" '$2 == n || $2 == "*" n { print }' SHA512-SUMS.txt > selected.sha512
            test -s selected.sha512
            sha512sum -c selected.sha512
          done
          unzip -q Godot_v4.6.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          echo /tmp/earth-tools >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -j -q Godot_v4.6.3-stable_export_templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Test and build unsigned preview
        shell: bash
        run: |
          set -euo pipefail
          godot=Godot_v4.6.3-stable_linux.x86_64
          "$godot" --headless --path . --editor --import --quit
          for suite in explorer_test interface_test ambient_test ui_scale_test; do
            "$godot" --headless --path . --script "res://tests/$suite.gd"
          done
          mkdir -p build/windows dist
          cp "$HOME/.local/share/godot/export_templates/4.6.3.stable/windows_release_x86_64.exe" build/windows/earth_template.exe
          python3 packaging/windows/set_icon.py build/windows/earth_template.exe assets/icon.ico
          "$godot" --headless --path . --export-release 'Windows Desktop' build/windows/LivingEarth3D.exe
          python3 tests/windows_icon_test.py build/windows/LivingEarth3D.exe
          makensis -V2 -DVERSION=0.5.2 -DBUILD_DIR="$PWD/build/windows" -DOUTPUT="$PWD/dist/LivingEarth3D-Setup-0.5.2.exe" packaging/windows/installer.nsi
          python3 tests/windows_icon_test.py dist/LivingEarth3D-Setup-0.5.2.exe --installer
          cd dist
          sha256sum LivingEarth3D-Setup-0.5.2.exe > LivingEarth3D-Setup-0.5.2.exe.sha256
          printf 'Source: %s\nUnsigned Linux cross-build. Windows execution and audio listening remain unverified.\n' "$GITHUB_SHA" > BUILD.txt
      - name: Publish installer then update discovery feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Living Earth preview delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -r dist /tmp/earth-delivery
          git checkout --orphan downloads/windows-0.5.2
          git rm -rf . >/dev/null
          cp /tmp/earth-delivery/* .
          git add LivingEarth3D-Setup-0.5.2.exe LivingEarth3D-Setup-0.5.2.exe.sha256 BUILD.txt
          git commit -m 'Publish unsigned 0.5.2 ambient sound preview'
          git push origin HEAD:refs/heads/downloads/windows-0.5.2
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          digest=hashlib.sha256(Path('/tmp/earth-delivery/LivingEarth3D-Setup-0.5.2.exe').read_bytes()).hexdigest()
          path=Path('updates/preview.json')
          feed=json.loads(path.read_text())
          assert feed['version']=='0.5.1', 'Feed advanced; review before promoting'
          feed.update(version='0.5.2',installer_url='https://github.com/nortja/Living-earth-3d/raw/refs/heads/downloads/windows-0.5.2/LivingEarth3D-Setup-0.5.2.exe',sha256=digest,installer_signed=False)
          path.write_text(json.dumps(feed,indent=2)+'\n')
          path=Path('README.md')
          text=path.read_text().replace('0.5.1','0.5.2')
          text=text.replace('## Development','Settings now offers saved interface sizes from 100% to 200%, plus Automatic. Smaller windows limit the effective size to keep controls reachable. The user confirmed 0.5.1 installed and works; 0.5.2 Windows DPI and upgrade checks remain outstanding.\n\n## Development')
          path.write_text(text)
          PY
          git add README.md updates/preview.json
          git commit -m 'Promote published 0.5.2 unsigned preview feed'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: LivingEarth3D-0.5.2-preview
          path: /tmp/earth-delivery/*
