name: Validate scene transition interruption (no publication)
on:
  push:
    branches: [fix/scene-transition-interruption]
permissions:
  contents: read
concurrency:
  group: living-earth-scene-interruption-validation
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y nsis xvfb libgl1-mesa-dri g++-mingw-w64-x86-64
          python3 -m pip install --break-system-packages -r packaging/windows/requirements-build.txt
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          mkdir -p /tmp/earth-tools
          cd /tmp/earth-tools
          curl -fLsS "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          for name in Godot_v4.6.3-stable_linux.x86_64.zip Godot_v4.6.3-stable_export_templates.tpz; do
            curl -fLsS "$base/$name" -o "$name"
            awk -v n="$name" '$2 == n || $2 == "*" n { print }' SHA512-SUMS.txt > selected.sha512
            test -s selected.sha512
            sha512sum -c selected.sha512
          done
          unzip -q Godot_v4.6.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          echo /tmp/earth-tools >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -j -q Godot_v4.6.3-stable_export_templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - uses: actions/upload-artifact@v4
        with:
          name: Godot-4.6.3-linux-tools
          path: /tmp/earth-tools/Godot_v4.6.3-stable_linux.x86_64.zip
      - name: Test and build unsigned preview
        shell: bash
        run: |
          set -euo pipefail
          godot=Godot_v4.6.3-stable_linux.x86_64
          "$godot" --headless --path . --editor --import --quit
          for suite in explorer_test interface_test ambient_test ui_scale_test automatic_updates_test camera_test camera_wall_test solar_test exploration_test arrival_test performance_test camera_expansion_test discovery_photos_test weather_layer_test satellite_snapshot_test camera_revalidation_test offline_atlas_test saved_places_backup_test sunlight_explorer_test journey_studio_test lunar_observatory_test screensaver_setup_test observed_weather_test space_studio_test moon_zoom_test scene_library_test; do
            "$godot" --headless --path . --script "res://tests/$suite.gd" 2>&1 | tee "/tmp/earth-$suite.log"
            if grep -Eq '^(SCRIPT ERROR|ERROR):' "/tmp/earth-$suite.log"; then exit 1; fi
            grep -Eq '[1-9][0-9]* checks, 0 failures' "/tmp/earth-$suite.log"
          done
          python3 tests/release_download_test.py
          pwsh -NoProfile -File tests/update_status_test.ps1
          pwsh -NoProfile -File tests/update_security_test.ps1
          pwsh -NoProfile -File tests/windows_build_scripts_test.ps1
          mkdir -p build/windows dist
          cp "$HOME/.local/share/godot/export_templates/4.6.3.stable/windows_release_x86_64.exe" build/windows/earth_template.exe
          python3 packaging/windows/set_icon.py build/windows/earth_template.exe assets/icon.ico
          "$godot" --headless --path . --export-release 'Windows Desktop' build/windows/LivingEarth3D.exe
          python3 tests/windows_icon_test.py build/windows/LivingEarth3D.exe
          "$godot" --headless --path . --export-pack 'Windows Desktop' build/windows/candidate.pck
          "$godot" --headless --main-pack build/windows/candidate.pck --script "$PWD/tests/packaged_resource_smoke_test.gd"
          g++ -std=c++17 -Wall -Wextra -Werror tests/screensaver_args_test.cpp -o /tmp/screensaver-args-test
          /tmp/screensaver-args-test
          python3 tests/screensaver_command_test.py /tmp/screensaver-args-test "$godot"
          python3 packaging/windows/build_screensaver.py --output build/windows/LivingEarth3D.scr
          python3 tests/windows_icon_test.py build/windows/LivingEarth3D.scr --launcher
          makensis -V2 -DVERSION=0.25.0 -DBUILD_DIR="$PWD/build/windows" -DOUTPUT="$PWD/dist/LivingEarth3D-Setup-0.25.0.exe" packaging/windows/installer.nsi
          python3 tests/windows_icon_test.py dist/LivingEarth3D-Setup-0.25.0.exe --installer
          cd dist
          sha256sum LivingEarth3D-Setup-0.25.0.exe > LivingEarth3D-Setup-0.25.0.exe.sha256
          printf 'Source: %s\nFresh application and native screensaver build. Windows release gates follow; physical mixed-DPI and audio listening remain field checks.\n' "$GITHUB_SHA" > BUILD.txt
      - name: Native Linux exploration, cameras and screensavers
        run: |
          for suite in scene_library_render_test space_studio_render_test observed_weather_render_test lunar_observatory_render_test journey_studio_render_test sunlight_explorer_render_test saved_places_backup_render_test offline_atlas_render_test satellite_snapshot_render_test weather_layer_render_test discovery_photos_render_test performance_render_test arrival_render_test exploration_render_test wall_render_test render_test intro_render_test; do
            xvfb-run -a -s '-screen 0 5120x2880x24' Godot_v4.6.3-stable_linux.x86_64 --path . --audio-driver Dummy --script "res://tests/$suite.gd" -- --keep-controls-visible 2>&1 | tee "/tmp/native-$suite.log"
            if grep -Eq '^(SCRIPT ERROR|ERROR):' "/tmp/native-$suite.log"; then exit 1; fi
            grep -F '0 failures' "/tmp/native-$suite.log"
          done
      - name: Native saver budgets and weather isolation
        run: |
          set -euo pipefail
          for mode in preview fullscreen; do
            args='--saver-hosted'
            if [ "$mode" = preview ]; then args="$args --saver-preview"; fi
            xvfb-run -a -s '-screen 0 5120x2880x24' Godot_v4.6.3-stable_linux.x86_64 --path . --audio-driver Dummy --script res://tests/native_saver_render_test.gd -- $args 2>&1 | tee "/tmp/native-saver-$mode.log"
            if grep -Eq '^(SCRIPT ERROR|ERROR):' "/tmp/native-saver-$mode.log"; then exit 1; fi
            grep -F '0 failures' "/tmp/native-saver-$mode.log"
          done
      - name: Record installed-file hashes
        run: python3 packaging/windows/write_payload_metadata.py --application build/windows/LivingEarth3D.exe --output dist/payload-hashes.json
      - uses: actions/upload-artifact@v4
        with:
          name: LivingEarth3D-0.25.0-candidate
          path: dist/*
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LivingEarth3D-0.25.0-candidate
          path: dist
      - name: Verify signatures and real installer update on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ProgressPreference='SilentlyContinue'
          ./tests/windows_build_scripts_test.ps1
          ./tests/update_status_test.ps1
          ./tests/update_security_test.ps1
          pwsh -NoProfile -File tests/update_status_test.ps1
          pwsh -NoProfile -File tests/update_security_test.ps1
          ./tests/windows_update_install_test.ps1 -Installer dist/LivingEarth3D-Setup-0.25.0.exe -PayloadMetadata dist/payload-hashes.json
          ./tests/windows_update_install_test.ps1 -Installer dist/LivingEarth3D-Setup-0.25.0.exe -PayloadMetadata dist/payload-hashes.json -BaselineVersion '0.24.0'
      - name: Install pinned test-only software OpenGL
        shell: powershell
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'mesa.7z'
          curl.exe -fL --retry 3 --output $archive 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          if($LASTEXITCODE -ne 0){throw 'Test OpenGL download failed'}
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'){throw 'Test OpenGL checksum mismatch'}
          7z x $archive ('-o'+(Join-Path $env:RUNNER_TEMP 'mesa')) -y
          if($LASTEXITCODE -ne 0){throw 'Test OpenGL extraction failed'}
          & (Join-Path $env:RUNNER_TEMP 'mesa/systemwidedeploy.cmd') 1
          if($LASTEXITCODE -ne 0){throw 'Test OpenGL ICD deployment failed'}
      - name: Actual Screen Saver Settings and selected Earth dropdown
        shell: powershell
        run: ./tests/windows_saver_settings_test.ps1 -Installer dist/LivingEarth3D-Setup-0.25.0.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-saver-settings-0.25.0-attempt-${{ github.run_attempt }}
          path: dist/windows-saver-settings.png
      - name: Actual Windows embedded preview and saver lifecycle
        shell: powershell
        run: ./tests/windows_screensaver_test.ps1 -Installer dist/LivingEarth3D-Setup-0.25.0.exe -SoftwareRendering -SoakMinutes 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-screensaver-0.25.0-attempt-${{ github.run_attempt }}-evidence
          path: |
            dist/windows-screensaver-*
            dist/windows-saver-preflight.log
  desktop:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LivingEarth3D-0.25.0-candidate
          path: dist
      - name: Install pinned test-only software OpenGL
        shell: powershell
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'mesa.7z'
          curl.exe -fL --retry 3 --output $archive 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          if($LASTEXITCODE -ne 0){throw 'Test OpenGL download failed'}
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'){throw 'Test OpenGL checksum mismatch'}
          7z x $archive ('-o'+(Join-Path $env:RUNNER_TEMP 'mesa')) -y
          if($LASTEXITCODE -ne 0){throw 'Test OpenGL extraction failed'}
          & (Join-Path $env:RUNNER_TEMP 'mesa/systemwidedeploy.cmd') 1
          if($LASTEXITCODE -ne 0){throw 'Test OpenGL ICD deployment failed'}
      - name: Actual installed desktop photographs, model layer and performance report
        shell: powershell
        run: |
          ./tests/windows_packaged_ui_test.ps1 -Installer dist/LivingEarth3D-Setup-0.25.0.exe -FullDisplayMatrix
          ./tests/windows_monitor_query_cost.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-packaged-desktop-0.25.0-attempt-${{ github.run_attempt }}
          path: dist/packaged-desktop/*
