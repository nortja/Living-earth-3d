name: Independently verify public 0.22.0 installer
on:
  push:
    branches: [validation/public-0.22.0]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify completed release and exact public updater bytes
        run: |
          mkdir -p dist/verified-public
          python3 packaging/windows/verify_release_download.py --version 0.22.0 --source-sha ac0d298d070d62f3782340c5c001f0c0ca101b67 --run-id 41338329092 --output-directory dist/verified-public > dist/verified-public/verification.json
          cat dist/verified-public/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: LivingEarth3D-0.22.0-independently-verified-public
          path: dist/verified-public/*
