name: Publish 0.8.0 preview once
on:
  push:
    branches: [release/preview-0.8.0]
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-preview-080
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39510334193
          name: LivingEarth3D-0.8.0-candidate
          path: dist
      - name: Parse repaired harness and verify updater security
        shell: powershell
        run: |
          ./tests/windows_build_scripts_test.ps1
          ./tests/update_security_test.ps1
      - name: Install pinned test-only software OpenGL
        shell: powershell
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'){throw 'Test OpenGL checksum mismatch'}
          7z x $archive ('-o'+(Join-Path $env:RUNNER_TEMP 'mesa')) -y
          if($LASTEXITCODE -ne 0){throw 'Test OpenGL extraction failed'}
      - name: Actual Windows embedded preview and saver lifecycle
        shell: powershell
        run: ./tests/windows_screensaver_test.ps1 -Installer dist/LivingEarth3D-Setup-0.8.0.exe -MesaDirectory (Join-Path $env:RUNNER_TEMP 'mesa/x64')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-screensaver-0.8.0-evidence
          path: dist/windows-screensaver-*.png
  publish:
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39510334193
          name: LivingEarth3D-0.8.0-candidate
          path: dist
      - name: Publish installer only (feed requires separate release signature)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c LivingEarth3D-Setup-0.8.0.exe.sha256
          cd ..
          git config user.name 'Living Earth preview delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -r dist /tmp/earth-delivery
          git checkout --orphan downloads/windows-0.8.0
          git rm -rf . >/dev/null
          cp /tmp/earth-delivery/* .
          git add LivingEarth3D-Setup-0.8.0.exe LivingEarth3D-Setup-0.8.0.exe.sha256 payload-hashes.json BUILD.txt wall-*.png sunlight.png explore-*.png saver-*.png
          git commit -m 'Publish Windows-validated 0.8.0 auto-update bootstrap preview'
          git push origin HEAD:refs/heads/downloads/windows-0.8.0
