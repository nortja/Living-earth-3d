name: Publish 0.8.0 preview once
on:
  push:
    branches: [release/preview-0.8.0]
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-preview-080
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39510334193
          name: LivingEarth3D-0.8.0-candidate
          path: dist
      - name: Install native build tools and pinned Godot command validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y nsis p7zip-full g++-mingw-w64-x86-64
          python3 -m pip install --break-system-packages -r packaging/windows/requirements-build.txt
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          mkdir -p /tmp/earth-tools
          cd /tmp/earth-tools
          curl -fLsS "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          name=Godot_v4.6.3-stable_linux.x86_64.zip
          curl -fLsS "$base/$name" -o "$name"
          awk -v n="$name" '$2 == n || $2 == "*" n { print }' SHA512-SUMS.txt > selected.sha512
          test -s selected.sha512
          sha512sum -c selected.sha512
          unzip -q "$name"
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          echo /tmp/earth-tools >> "$GITHUB_PATH"
      - name: Rebuild launcher and installer around the verified frozen Godot application
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c LivingEarth3D-Setup-0.8.0.exe.sha256
          cd ..
          mkdir -p build/frozen build/windows
          7z x -y dist/LivingEarth3D-Setup-0.8.0.exe -obuild/frozen >/dev/null
          python3 - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          expected=json.loads(Path('dist/payload-hashes.json').read_text())['LivingEarth3D.exe']
          matches=list(Path('build/frozen').rglob('LivingEarth3D.exe'))
          assert len(matches)==1
          app=matches[0]
          assert hashlib.sha256(app.read_bytes()).hexdigest()==expected
          shutil.copy2(app,'build/windows/LivingEarth3D.exe')
          print('Frozen Godot application hash verified:',expected)
          PY
          g++ -std=c++17 -Wall -Wextra -Werror tests/screensaver_args_test.cpp -o /tmp/screensaver-args-test
          /tmp/screensaver-args-test
          python3 tests/screensaver_command_test.py /tmp/screensaver-args-test Godot_v4.6.3-stable_linux.x86_64
          python3 packaging/windows/build_screensaver.py --output build/windows/LivingEarth3D.scr
          python3 tests/windows_icon_test.py build/windows/LivingEarth3D.scr --launcher
          makensis -V2 -DVERSION=0.8.0 -DBUILD_DIR="$PWD/build/windows" -DOUTPUT="$PWD/dist/LivingEarth3D-Setup-0.8.0.exe" packaging/windows/installer.nsi
          python3 tests/windows_icon_test.py dist/LivingEarth3D-Setup-0.8.0.exe --installer
          python3 packaging/windows/write_payload_metadata.py --application build/windows/LivingEarth3D.exe --output dist/payload-hashes.json
          cd dist
          sha256sum LivingEarth3D-Setup-0.8.0.exe > LivingEarth3D-Setup-0.8.0.exe.sha256
          printf 'Native launcher source: %s\nGodot app and render evidence preserved from validated build 39510334193, source 113f5314a5a586fc2af1b0c6dc51af78aeec8b8f.\nWindows release gates run against this exact rebuilt installer.\n' "$GITHUB_SHA" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LivingEarth3D-0.8.0-fixed-candidate
          path: dist/*
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LivingEarth3D-0.8.0-fixed-candidate
          path: dist
      - name: Verify signatures and real installer update on Windows PowerShell 5.1
        shell: powershell
        run: |
          ./tests/windows_build_scripts_test.ps1
          ./tests/update_security_test.ps1
          ./tests/windows_update_install_test.ps1 -Installer dist/LivingEarth3D-Setup-0.8.0.exe -PayloadMetadata dist/payload-hashes.json
          ./tests/windows_update_install_test.ps1 -Installer dist/LivingEarth3D-Setup-0.8.0.exe -PayloadMetadata dist/payload-hashes.json -BaselineVersion '0.7.0'
      - name: Install pinned test-only software OpenGL
        shell: powershell
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'mesa.7z'
          curl.exe -fL --retry 3 --output $archive 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          if($LASTEXITCODE -ne 0){throw 'Test OpenGL download failed'}
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'){throw 'Test OpenGL checksum mismatch'}
          7z x $archive ('-o'+(Join-Path $env:RUNNER_TEMP 'mesa')) -y
          if($LASTEXITCODE -ne 0){throw 'Test OpenGL extraction failed'}
      - name: Actual Windows embedded preview and saver lifecycle
        shell: powershell
        run: ./tests/windows_screensaver_test.ps1 -Installer dist/LivingEarth3D-Setup-0.8.0.exe -MesaDirectory (Join-Path $env:RUNNER_TEMP 'mesa/x64')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-screensaver-0.8.0-evidence
          path: dist/windows-screensaver-*.png
  publish:
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LivingEarth3D-0.8.0-fixed-candidate
          path: dist
      - name: Publish installer only (feed requires separate release signature)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c LivingEarth3D-Setup-0.8.0.exe.sha256
          cd ..
          git config user.name 'Living Earth preview delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -r dist /tmp/earth-delivery
          git checkout --orphan downloads/windows-0.8.0
          git rm -rf . >/dev/null
          cp /tmp/earth-delivery/* .
          git add LivingEarth3D-Setup-0.8.0.exe LivingEarth3D-Setup-0.8.0.exe.sha256 payload-hashes.json BUILD.txt wall-*.png sunlight.png explore-*.png saver-*.png
          git commit -m 'Publish Windows-validated 0.8.0 auto-update bootstrap preview'
          git push origin HEAD:refs/heads/downloads/windows-0.8.0
