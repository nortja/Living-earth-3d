name: Windows installer
on:
  workflow_dispatch:
    inputs:
      full_display_matrix:
        description: Run ultrawide, 4K and 5K native EXE checks (requires a suitable desktop)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows scripts and release version
        shell: pwsh
        run: |
          ./tests/windows_build_scripts_test.ps1
          $version = (Select-String -Path project.godot -Pattern 'config/version="([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -notmatch ('^v' + [regex]::Escape($version) + '(-preview\.\d+)?$')) { throw 'Tag and project version disagree' }
      - name: Install verified Godot export tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable'
          $tools = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $tools | Out-Null
          Invoke-WebRequest "$base/SHA512-SUMS.txt" -OutFile "$tools/SHA512-SUMS.txt"
          foreach ($name in @('Godot_v4.6.3-stable_win64.exe.zip', 'Godot_v4.6.3-stable_export_templates.tpz')) {
            Invoke-WebRequest "$base/$name" -OutFile "$tools/$name"
            $line = Get-Content "$tools/SHA512-SUMS.txt" | Where-Object { $_.Trim().EndsWith($name) }
            if (@($line).Count -ne 1) { throw "Missing checksum for $name" }
            $expected = ($line.Trim() -split '\s+')[0]
            if ((Get-FileHash "$tools/$name" -Algorithm SHA512).Hash -ine $expected) { throw "Checksum mismatch: $name" }
          }
          Expand-Archive "$tools/Godot_v4.6.3-stable_win64.exe.zip" "$tools/editor"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $templates = Join-Path $env:APPDATA 'Godot/export_templates/4.6.3.stable'
          New-Item -ItemType Directory -Force $templates | Out-Null
          $zip = [IO.Compression.ZipFile]::OpenRead("$tools/Godot_v4.6.3-stable_export_templates.tpz")
          try {
            foreach ($entry in $zip.Entries) {
              if ($entry.Name -in @('windows_release_x86_64.exe', 'windows_debug_x86_64.exe', 'version.txt')) {
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $templates $entry.Name), $true)
              }
            }
          } finally { $zip.Dispose() }
          "$tools/editor" | Out-File $env:GITHUB_PATH -Append
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Exercise process runner with actual Godot
        shell: pwsh
        run: ./tests/godot_process_test.ps1 -Godot Godot_v4.6.3-stable_win64.exe
      - name: Build development installer (no publication)
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Godot Godot_v4.6.3-stable_win64.exe -Makensis 'C:/Program Files (x86)/NSIS/makensis.exe'
      - name: Install, launch and uninstall the actual Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem dist/*Setup*.exe | Select-Object -First 1).FullName
          $setup = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Install failed' }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs/Living Earth 3D'
          if (!(Test-Path "$dir/LivingEarth3D.exe")) { throw 'Application missing' }
          if (!(Test-Path ([Environment]::GetFolderPath('Desktop') + '/Living Earth 3D.lnk'))) { throw 'Desktop shortcut missing' }
          . ./packaging/windows/invoke-godot.ps1
          Invoke-EarthGodot -Executable "$dir/LivingEarth3D.exe" -ProjectPath $dir -Arguments @('--quit-after','120') -LogPath "$env:RUNNER_TEMP/installed-app.log"
          if ('${{ inputs.full_display_matrix }}' -eq 'true') {
            ./tests/windows_display_test.ps1 -Application "$dir/LivingEarth3D.exe"
          } else {
            ./tests/windows_display_test.ps1 -Application "$dir/LivingEarth3D.exe" -Resolutions @('1920x1080')
          }
          # _?= keeps the NSIS uninstaller synchronous. No running process is force-killed.
          $uninstall = Start-Process "$dir/Uninstall.exe" -ArgumentList "/S _?=$dir" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$dir/LivingEarth3D.exe")) { throw 'Uninstall failed' }
      - name: Upload development installer only after validation
        uses: actions/upload-artifact@v4
        with:
          name: LivingEarth3D-Development-Installer
          path: |
            dist/*Setup*.exe
            dist/*.sha256
      - name: Retain diagnostics even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LivingEarth3D-Windows-Diagnostics
          if-no-files-found: ignore
          path: |
            build/*.log
            build/windows-display-results/**
            ${{ runner.temp }}/installed-app.log
