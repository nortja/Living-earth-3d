name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
  statuses: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows scripts and release version
        shell: pwsh
        run: |
          foreach ($file in @('packaging/windows/build.ps1', 'packaging/windows/update.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          $version = (Select-String -Path project.godot -Pattern 'config/version="([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -notmatch ('^v' + [regex]::Escape($version) + '(-preview\.\d+)?$')) { throw 'Tag and project version disagree' }
      - name: Install verified Godot export tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable'
          $tools = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $tools | Out-Null
          Invoke-WebRequest "$base/SHA512-SUMS.txt" -OutFile "$tools/SHA512-SUMS.txt"
          foreach ($name in @('Godot_v4.6.3-stable_win64.exe.zip', 'Godot_v4.6.3-stable_export_templates.tpz')) {
            Invoke-WebRequest "$base/$name" -OutFile "$tools/$name"
            $line = Get-Content "$tools/SHA512-SUMS.txt" | Where-Object { $_.Trim().EndsWith($name) }
            if (@($line).Count -ne 1) { throw "Missing checksum for $name" }
            $expected = ($line.Trim() -split '\s+')[0]
            if ((Get-FileHash "$tools/$name" -Algorithm SHA512).Hash -ine $expected) { throw "Checksum mismatch: $name" }
          }
          Expand-Archive "$tools/Godot_v4.6.3-stable_win64.exe.zip" "$tools/editor"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $templates = Join-Path $env:APPDATA 'Godot/export_templates/4.6.3.stable'
          New-Item -ItemType Directory -Force $templates | Out-Null
          $zip = [IO.Compression.ZipFile]::OpenRead("$tools/Godot_v4.6.3-stable_export_templates.tpz")
          try {
            foreach ($entry in $zip.Entries) {
              if ($entry.Name -in @('windows_release_x86_64.exe', 'windows_debug_x86_64.exe', 'version.txt')) {
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $templates $entry.Name), $true)
              }
            }
          } finally { $zip.Dispose() }
          "$tools/editor" | Out-File $env:GITHUB_PATH -Append
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Build single executable installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $pfx = ''
          try {
            if ($env:SIGNING_PFX_BASE64) {
              $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            }
            ./packaging/windows/build.ps1 -Godot 'Godot_v4.6.3-stable_win64.exe' -Makensis 'C:/Program Files (x86)/NSIS/makensis.exe' -SigningPfx $pfx -SigningPassword $env:SIGNING_PASSWORD
          } catch {
            $message = $_.Exception.Message
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=failure -f context=installer-build -f description=$message.Substring(0, [Math]::Min(140, $message.Length))
            throw
          } finally {
            if ($pfx) { Remove-Item -LiteralPath $pfx -Force }
          }
      - name: Windows install, launch, shortcut and uninstall smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem dist/*Setup*.exe).FullName
          $setup = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Install failed' }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs/Living Earth 3D'
          if (!(Test-Path "$dir/LivingEarth3D.exe")) { throw 'Application missing' }
          if (!(Test-Path ([Environment]::GetFolderPath('Desktop') + '/Living Earth 3D.lnk'))) { throw 'Desktop shortcut missing' }
          Start-Sleep -Seconds 5
          Get-Process LivingEarth3D -ErrorAction SilentlyContinue | Stop-Process
          $log = Join-Path $env:RUNNER_TEMP 'living-earth-smoke.log'
          $app = Start-Process "$dir/LivingEarth3D.exe" -ArgumentList '--headless', '--quit-after', '120', '--log-file', $log -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Installed app startup failed' }
          if (!(Test-Path $log)) { throw 'Installed app did not produce a runtime log' }
          if (Select-String -Path $log -Pattern 'SCRIPT ERROR:|ERROR:') { throw 'Installed app reported runtime errors' }
          # NSIS uninstall copies itself before removing the installation; _?= keeps this smoke test synchronous.
          $uninstall = Start-Process "$dir/Uninstall.exe" -ArgumentList "/S _?=$dir" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$dir/LivingEarth3D.exe")) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: LivingEarth3D-Windows-Installer
          path: |
            dist/*Setup*.exe
            dist/*.sha256
      - name: Attach installer to GitHub preview release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = 'Download the Setup EXE for Windows. This unsigned preview installs the app and desktop shortcut with no separate dependencies. Includes offline Earth imagery, night lights, discovery journeys, and favorites. Windows install/startup/uninstall smoke tests passed in CI. Signed automatic updates and hardware testing remain before public release.'
          gh release create $tag --verify-tag --prerelease --title 'Living Earth 3D 0.2.0 — Windows installer preview' --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          $assets = Get-ChildItem dist/*Setup*.exe, dist/*.sha256 | ForEach-Object FullName
          gh release upload $tag @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
